name: Checks

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  check-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run-checks: ${{ steps.plan.outputs.run-checks }}
      run-playback: ${{ steps.plan.outputs.run-playback }}
      run-replacement: ${{ steps.plan.outputs.run-replacement }}
    steps:
      - name: Plan which checks this change needs
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const releasePr = pr && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
                && pr.head.ref === 'develop' && pr.base.ref === 'main';
            let runChecks = true;
            if (releasePr) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
              });
              if (['ahead', 'identical'].includes(comparison.status)) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id: 'checks.yml',
                  branch: 'develop',
                  event: 'push',
                  head_sha: pr.head.sha,
                  per_page: 1,
                });
                const previous = data.workflow_runs[0];
                if (previous?.status === 'completed' && previous.conclusion === 'success') {
                  runChecks = false;
                  core.notice(`Reusing successful develop checks: ${previous.html_url}`);
                  await core.summary.addLink('Verified develop checks', previous.html_url).write();
                }
              }
            }
            // The slow suites run when their inputs change and on every release PR; the daily
            // compatibility workflow runs them regardless.
            const playbackInputs = /^(liquidsoap\/|tests\/playback\.py|tests\/spacing\.liq|tests\/liquidsoap\.liq|tests\/failsafe\.sh|\.github\/workflows\/checks\.yml)/;
            const replacementInputs = /^(src\/Service\/(PlaylistReplacement|Queue|Media)\.php|tests\/replacement\.php|composer\.(json|lock)|\.github\/workflows\/checks\.yml)/;
            let changed = null;
            if (runChecks && !releasePr) {
              const base = pr ? pr.base.sha : context.payload.before;
              if (base && !/^0+$/.test(base)) {
                try {
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({
                    ...context.repo,
                    basehead: `${base}...${context.sha}`,
                  });
                  changed = data.files.map((file) => file.filename);
                } catch (error) {
                  core.warning(`Cannot list changed files (${error.message}); running every check.`);
                }
              }
            }
            const touches = (pattern) => changed === null || changed.some((file) => pattern.test(file));
            core.setOutput('run-checks', String(runChecks));
            core.setOutput('run-playback', String(runChecks && touches(playbackInputs)));
            core.setOutput('run-replacement', String(runChecks && touches(replacementInputs)));

  php:
    needs: check-plan
    if: needs.check-plan.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpcs
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l events.php
      - run: composer test
      - run: php tests/media.php
      - run: php tests/queue.php

  replacement:
    needs: check-plan
    if: needs.check-plan.outputs.run-replacement == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: sweepers_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check replacement against native AzuraCast playlist selection
        run: |
          docker run --rm --network host --entrypoint php \
            -v "$PWD:/plugin:ro" \
            ghcr.io/azuracast/azuracast@sha256:00514c7e5f96e4142a162955905591108750594c849730e3ab1485ef26a292a1 \
            /plugin/tests/replacement.php

  frontend:
    needs: check-plan
    if: needs.check-plan.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node tests/bundle-smoke.js
      - name: Check setup workflow without restarting services
        run: bash tests/setup.sh

  liquidsoap:
    needs: check-plan
    if: needs.check-plan.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Earlier AzuraCast release with Liquidsoap 2.4.5.
          - name: liquidsoap-2.4.5
            image: savonet/liquidsoap:v2.4.5
            binary: liquidsoap
            runtime: 19d68c47b1e4d569885ca7cf4c40609cbabefda7
          # AzuraCast's own image (Liquidsoap 2.5.0) with its matching runtime, as running in production.
          - name: azuracast-liquidsoap-2.5.0
            image: ghcr.io/azuracast/azuracast@sha256:00514c7e5f96e4142a162955905591108750594c849730e3ab1485ef26a292a1
            binary: /usr/bin/liquidsoap
            runtime: aafac693c6b065432ebfb751c92d4bfe9ef3d770
    name: ${{ matrix.name }}
    env:
      LIQUIDSOAP_IMAGE: ${{ matrix.image }}
      LIQUIDSOAP_BIN: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the matching AzuraCast runtime
        run: |
          mkdir -p /tmp/azuracast-runtime
          for file in azuracast crossfade utilities; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/AzuraCast/AzuraCast/${{ matrix.runtime }}/util/docker/stations/liquidsoap/$file.liq" \
              --output "/tmp/azuracast-runtime/$file.liq"
          done
      - name: Pull the Liquidsoap image
        run: docker pull --quiet "$LIQUIDSOAP_IMAGE"
      - uses: actions/setup-python@v5
        if: needs.check-plan.outputs.run-playback == 'true'
        with:
          python-version: '3.12'
      - name: Check the native Liquidsoap source types
        run: |
          docker run --rm --entrypoint "$LIQUIDSOAP_BIN" \
            -v "$PWD:/plugin:ro" \
            -v /tmp/azuracast-runtime:/azuracast:ro \
            "$LIQUIDSOAP_IMAGE" --check /plugin/tests/liquidsoap.liq
      - name: Check song spacing policy
        run: |
          docker run --rm --entrypoint "$LIQUIDSOAP_BIN" \
            -v "$PWD:/plugin:ro" \
            -v /tmp/azuracast-runtime:/azuracast:ro \
            "$LIQUIDSOAP_IMAGE" /plugin/tests/spacing.liq
      - name: Verify fail-safe rollback with the real Liquidsoap check
        if: needs.check-plan.outputs.run-playback == 'true'
        run: bash tests/failsafe.sh /tmp/azuracast-runtime
      - name: Render playback and cancellation with AzuraCast's AutoDJ factory
        if: needs.check-plan.outputs.run-playback == 'true'
        run: |
          for scenario in normal skip live unavailable spacing playlist-spacing hot-enable hot-disable hot-pending hot-change hot-error before-jingle computed-autocue provided-autocue arrange reverb; do
            python3 tests/playback.py --scenario "$scenario" \
              --runtime /tmp/azuracast-runtime \
              --liquidsoap "docker run --rm --network host --user $(id -u):$(id -g) \
                --entrypoint $LIQUIDSOAP_BIN -v $PWD:$PWD:ro -v /tmp:/tmp \
                $LIQUIDSOAP_IMAGE" \
              || { grep -vE 'Content type|decoder\.|startup:' ".checks/playback-$scenario.log" | tail -n 120; exit 1; }
          done